# 推送到 main/master 或手动运行后打包，并上传到对应版本的 Release
# 安装包文件名固定为 FNTV_release_v版本号.apk
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android licenses
        run: |
          sdkmanager=$(ls -d "${ANDROID_HOME}/cmdline-tools/"*/bin/sdkmanager 2>/dev/null | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-33" "build-tools;33.0.2"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNTV-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName *"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "versionName not found"
            exit 1
          fi
          mkdir -p dist
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$src" "dist/FNTV_release_v${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Prepared FNTV_release_v${version}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: ${{ steps.apk.outputs.version }}
          files: dist/FNTV_release_v${{ steps.apk.outputs.version }}.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
